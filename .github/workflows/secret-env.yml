name: Secret env names

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # secure-signage-worker.mjs --self-check läser worker.js vid .deployed-ref.
          fetch-depth: 0
      - run: node scripts/check-vite-secrets.mjs
      - run: node scripts/secure-signage-worker.mjs --self-check
      - run: node scripts/secure-cogwork-proxy.mjs --self-check
      - run: node --check workers/sodss-signage/worker.js
      - run: node --check workers/sds-cogwork-proxy/worker.js
