name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Kör varje kvart för att hålla Shopify-data färsk
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Refuse secret-like Vite env names
        run: node scripts/check-vite-secrets.mjs

      - name: Fetch Shopify data
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_SECRET: ${{ secrets.SHOPIFY_SECRET }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
        run: node scripts/fetch-shopify.js

      - run: npm run build
        env:
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path }}
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Publik DSN, ingen hemlighet. Tom sträng skulle stänga av Sentry.
          VITE_SENTRY_DSN: https://1016c5033514434d4805b5e73aa3b99a@o4512322194112512.ingest.de.sentry.io/4512322209841232
          VITE_SENTRY_RELEASE: sds-dashboard@${{ github.sha }}
          # Valfri hemlighet. Saknas den byggs sidan ändå, men källkartor laddas inte upp.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://de.sentry.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
