# wrangler.toml — SODSS Signage Worker
# Driftsätt med: npx wrangler deploy

name = "sodss-signage"
main = "../workers/sodss-signage/worker.js"
compatibility_date = "2024-01-01"
# Behåll variabler som satts i Cloudflare-dashboarden (t.ex. SUPABASE_URL,
# CORS_ORIGIN) vid wrangler deploy. Utan den skrivs de över och admin-rutterna
# failar stängt.
keep_vars = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sodss-signage"

# Källan som publiceras är workers/sodss-signage/worker.js.
# Använd scripts/secure-signage-worker.mjs. Den byter bara skriptet och lämnar bindings.
# Admin-rutter kräver SUPABASE_URL och SUPABASE_ANON_KEY och failar stängt om de saknas.
# Pi-agenterna använder CORE_AGENT_TOKEN eller SCREEN_AGENT_TOKENS.
